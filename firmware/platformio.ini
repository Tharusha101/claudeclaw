; crabtag keytag firmware
; ST7735 1.8" 128x160 display (software SPI, Adafruit_GFX) + three buttons.
; The link is chosen at build time:
;   esp32-c3       BLE      ("home", default) -- pio run -t upload
;   esp32-c3-wifi  WiFi/WS  ("away")          -- pio run -e esp32-c3-wifi -t upload
;   esp32          BLE on a classic WROOM-32  -- pio run -e esp32 -t upload
;
; The WiFi build needs firmware/src/secrets.h (copy secrets.h.example).

[platformio]
default_envs = esp32-c3

[env]
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv  ; NimBLE / WS + GFX need more than the default
lib_deps = adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3

[common]
c3_flags =
    -D PIN_TFT_CS=7
    -D PIN_TFT_DC=10
    -D PIN_TFT_RST=3
    -D PIN_TFT_MOSI=6
    -D PIN_TFT_SCLK=4
    -D BTN_DENY_PIN=0
    -D BTN_AUX_PIN=1
    -D BTN_ALLOW_PIN=21
    -D LED_PIN=8
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- ESP32-C3, BLE ("home", default) ---
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = ${common.c3_flags}

; --- ESP32-C3, WiFi/WebSocket ("away") ---
[env:esp32-c3-wifi]
platform = espressif32
board = esp32-c3-devkitm-1
lib_deps =
    ${env.lib_deps}
    links2004/WebSockets@^2.4.1
build_flags =
    ${common.c3_flags}
    -D KEYTAG_WIFI

; --- Classic ESP32 (WROOM-32 DevKit), BLE, pins remapped to GPIO <=21 ---
[env:esp32]
platform = espressif32
board = esp32dev
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -D PIN_TFT_CS=5
    -D PIN_TFT_DC=2
    -D PIN_TFT_RST=4
    -D PIN_TFT_MOSI=13
    -D PIN_TFT_SCLK=14
    -D BTN_DENY_PIN=16
    -D BTN_AUX_PIN=17
    -D BTN_ALLOW_PIN=21
