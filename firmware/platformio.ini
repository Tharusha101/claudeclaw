; crabtag keytag firmware — phase 2a bring-up
; ILI9341 240x320 SPI display + three buttons, driven over USB serial.
;
; Two boards share one src/main.cpp. The display driver + fonts are common; only
; the pinout and (for the C3) the native-USB flags differ per environment.
; TFT_eSPI is configured entirely via build_flags (USER_SETUP_LOADED=1) — there
; is no User_Setup.h to edit.
;
;   pio run -t upload            -> builds the default env (esp32)
;   pio run -e esp32-c3 -t upload -> builds for the C3

[platformio]
default_envs = esp32-c3

[env]
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@^2.5.43

[common]
tft_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000

; --- Classic ESP32 (WROOM-32 DevKit) — the board we're testing on now ---
[env:esp32]
platform = espressif32
board = esp32dev
build_flags =
    ${common.tft_flags}
    -D TFT_MISO=-1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D BTN_DENY_PIN=16
    -D BTN_AUX_PIN=17
    -D BTN_ALLOW_PIN=21

; --- ESP32-C3 mini — the eventual keytag MCU (native USB) ---
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${common.tft_flags}
    -D TFT_MOSI=6
    -D TFT_SCLK=4
    -D TFT_MISO=5
    -D TFT_CS=7
    -D TFT_DC=10
    -D TFT_RST=3
    -D BTN_DENY_PIN=0
    -D BTN_AUX_PIN=1
    -D BTN_ALLOW_PIN=21
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
