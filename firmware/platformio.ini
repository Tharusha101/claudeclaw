; crabtag keytag firmware — phase 2a bring-up
; ST7735 1.8" 128x160 display (software SPI, Adafruit_GFX) + three buttons, over USB serial.
;
; Two boards share one src/main.cpp. Pins are passed as build flags; the C3 adds
; native-USB flags. Software SPI is used deliberately — TFT_eSPI's direct-register
; SPI path faults on the ESP32-C3, and our redraw rate is far too low to care about
; the speed difference.
;
;   pio run -t upload             -> builds the default env (esp32-c3)
;   pio run -e esp32 -t upload    -> builds for a classic ESP32

[platformio]
default_envs = esp32-c3

[env]
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv  # NimBLE + GFX need more app space than the default
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    h2zero/NimBLE-Arduino@^1.4.3

; --- ESP32-C3 mini (native USB) — the board we're testing on now ---
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    -D PIN_TFT_CS=7
    -D PIN_TFT_DC=10
    -D PIN_TFT_RST=3
    -D PIN_TFT_MOSI=6
    -D PIN_TFT_SCLK=4
    -D BTN_DENY_PIN=0
    -D BTN_AUX_PIN=1
    -D BTN_ALLOW_PIN=21
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- Classic ESP32 (WROOM-32 DevKit), pins remapped to GPIO <=21 ---
[env:esp32]
platform = espressif32
board = esp32dev
build_flags =
    -D PIN_TFT_CS=5
    -D PIN_TFT_DC=2
    -D PIN_TFT_RST=4
    -D PIN_TFT_MOSI=13
    -D PIN_TFT_SCLK=14
    -D BTN_DENY_PIN=16
    -D BTN_AUX_PIN=17
    -D BTN_ALLOW_PIN=21
