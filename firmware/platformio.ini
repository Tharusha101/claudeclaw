; crabtag keytag firmware — phase 2a bring-up
; ESP32-C3 + ILI9341 (240x320 SPI) + three buttons, driven over USB serial.
;
; TFT_eSPI is configured entirely via build_flags here (USER_SETUP_LOADED=1),
; so there is no User_Setup.h to edit. If your board is a LOLIN C3 Mini, you can
; switch `board` to `lolin_c3_mini`; esp32-c3-devkitm-1 is the safe generic.

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@^2.5.43

build_flags =
    ; --- display driver + geometry ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; --- SPI pinout: C3 GPIO -> ILI9341 module ---
    -D TFT_MOSI=6
    -D TFT_SCLK=4
    -D TFT_MISO=5      ; optional for drawing; leave unconnected if you like
    -D TFT_CS=7
    -D TFT_DC=10
    -D TFT_RST=3
    -D TFT_BL=-1       ; backlight not driven by a GPIO; wire LED -> 3V3
    ; --- fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
    ; --- C3 uses native USB for Serial (USB CDC) ---
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
