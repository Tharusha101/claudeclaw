[project]
name = "crabtag"
version = "0.1.0"
description = "Bridge daemon connecting Claude Code to the crabtag keychain device (phase 1: terminal stub)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

# Synced by default on `uv run`, so `uv run pytest -m smoke` works with no extra flags.
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",       # required by fastapi.testclient
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "smoke: end-to-end bridge smoke test (fires a synthetic PermissionRequest at a running app)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
